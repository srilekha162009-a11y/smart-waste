<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Waste Management</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background-color: #f3f7f4;
      color: #1f2d24;
      line-height: 1.5;
    }

    header {
      background-color: #1f6f43;
      color: #ffffff;
      text-align: center;
      padding: 24px 16px 14px;
    }

    header h1 {
      font-size: 24px;
      letter-spacing: 0.8px;
      margin-bottom: 6px;
    }

    header p.tagline {
      font-size: 13px;
      opacity: 0.95;
      margin-bottom: 16px;
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 24px;
      flex-wrap: wrap;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
    }

    nav a {
      color: #ffffff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
    }

    nav a:hover {
      text-decoration: underline;
    }

    .container {
      max-width: 780px;
      margin: 24px auto;
      padding: 0 16px;
    }

    .card {
      background-color: #ffffff;
      border: 1px solid #dce6df;
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
    }

    .card h2 {
      color: #1f6f43;
      font-size: 19px;
      margin-bottom: 10px;
    }

    .card p {
      font-size: 14px;
      color: #37473d;
    }

    .form-group {
      margin-top: 14px;
    }

    label {
      display: block;
      font-size: 14px;
      margin-bottom: 8px;
      color: #2b3a30;
    }

    input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      font-size: 14px;
      border: 1px solid #b8c7bd;
      border-radius: 5px;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #1f6f43;
    }

    button {
      margin-top: 14px;
      background-color: #1f6f43;
      color: #ffffff;
      border: none;
      padding: 10px 18px;
      font-size: 14px;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #175734;
    }
